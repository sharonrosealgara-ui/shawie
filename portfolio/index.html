<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharon Rose · Digital Solutions Studio</title>
<meta name="description" content="Digital Solutions Studio — websites, automation & AI for growing businesses.">
<style>
html,body{margin:0;height:100%;background:#f4ede3;color:#211a13;font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.load{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.mono{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;letter-spacing:.16em;font-weight:600}
.mono small{display:block;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.4em;color:#8a7b6e;margin-top:2px;font-weight:400}
.sp{width:34px;height:34px;border:3px solid rgba(156,106,52,.25);border-top-color:#9c6a34;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#9c6a34}
</style>
<script>window.location.replace('Portfolio Hub.dc.html');</script>
</head>
<body>
<!-- Netlify Forms detection (parsed at deploy; hidden from users). Submissions appear in Netlify → Forms and email you. -->
<form name="shawie-signup" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
</form>
<form name="password-reset" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="email" name="email" />
</form>
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <textarea name="message"></textarea>
</form>
<form name="booking" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="phone" /><input type="text" name="event" /><input type="text" name="date" /><textarea name="details"></textarea>
</form>
<form name="order" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" /><input type="text" name="items" /><input type="text" name="total" /><input type="text" name="method" /><input type="text" name="type" />
</form>
<form name="viewing" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" /><input type="email" name="email" /><input type="text" name="property" /><input type="text" name="price" />
</form>
<form name="rsvp" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" /><input type="text" name="attending" /><input type="text" name="guests" /><input type="text" name="meal" />
</form>
<form name="payment" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" /><input type="text" name="amount" /><input type="text" name="method" /><input type="text" name="reference" /><input type="text" name="forWhat" />
</form>
<div class="load">
<div class="mono">SHARON ROSE<small>DIGITAL SOLUTIONS STUDIO</small></div>
<div class="sp"></div>
<p>Loading… if nothing happens, <a href="Portfolio Hub.dc.html">tap here to enter</a>.</p>
</div>
</body>
</html>
