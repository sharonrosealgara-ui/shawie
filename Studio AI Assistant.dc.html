<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
.ai{--bg:#f4ede3;--panel:#fff;--ink:#1b140d;--mut:#5c4c3d;--gold:#9c6a34;--gold2:#7d5324;--champ:#c2984f;--data:#2a6f8a;--data2:#4d9bb5;--line:#e2d5bf;--esp:#241d16;--ok:#4d8259;display:flex;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.ai h1,.ai h2,.ai h3,.ai h4{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.06}
.rail{width:290px;flex:none;background:linear-gradient(180deg,var(--esp),#3a2c22);color:#cdb992;position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 0}
.rbrand{padding:0 24px 20px;border-bottom:1px solid rgba(205,185,146,.16);margin-bottom:16px}
.rbrand .ey{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--champ);font-weight:700}
.rbrand h1{color:#fff;font-size:22px;margin-top:6px;line-height:1.1}
.rbrand p{font-size:11.5px;color:rgba(205,185,146,.8);margin-top:6px;line-height:1.5}
.rlab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(205,185,146,.5);padding:14px 24px 8px;font-weight:600}
.mode{display:flex;gap:12px;align-items:flex-start;padding:13px 18px;margin:0 12px;border-radius:11px;cursor:pointer;transition:.16s}
.mode:hover{background:rgba(205,185,146,.09)}
.mode.on{background:var(--gold);color:#fff}
.mode .mi{width:30px;height:30px;border-radius:8px;background:rgba(205,185,146,.14);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.mode.on .mi{background:rgba(255,255,255,.2)}
.mode .mt{flex:1;min-width:0}
.mode .mn{font-size:13px;font-weight:600;color:#fff;line-height:1.2}
.mode .md{font-size:10.5px;color:rgba(205,185,146,.8);margin-top:2px;line-height:1.4}
.mode.on .md{color:rgba(255,255,255,.82)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.chead{padding:20px 30px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:14px}
.chead .ci{width:46px;height:46px;border-radius:12px;background:linear-gradient(140deg,var(--gold),var(--champ));display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.chead h2{font-size:20px}
.chead .cs{font-size:12px;color:var(--mut);margin-top:1px;display:flex;align-items:center;gap:6px}
.chead .cs .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chead .badge{margin-left:auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--data);background:rgba(42,111,138,.12);padding:6px 13px;border-radius:20px}
.thread{flex:1;overflow-y:auto;padding:28px 30px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}
.msg{max-width:76%;font-size:14px;line-height:1.6}
.msg.them{align-self:flex-start;display:flex;gap:11px}
.msg.them .av{width:34px;height:34px;border-radius:50%;background:var(--esp);color:var(--champ);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.msg.them .bub{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:13px 16px;color:var(--ink)}
.msg.me{align-self:flex-end}
.msg.me .bub{background:var(--gold);color:#fff;border-radius:14px 14px 4px 14px;padding:13px 16px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12.5px;color:var(--gold2);font-weight:500;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--gold);background:#fbf3ea}
.typing{align-self:flex-start;display:flex;gap:11px}
.typing .av{width:34px;height:34px;border-radius:50%;background:var(--esp);color:var(--champ);display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.typing .bub{background:var(--panel);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:15px 18px;display:flex;gap:5px}
.typing .bub i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5;animation:blink 1.2s infinite}
.typing .bub i:nth-child(2){animation-delay:.2s}.typing .bub i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{padding:18px 30px 22px;border-top:1px solid var(--line);background:var(--panel)}
.cin{display:flex;gap:12px;align-items:flex-end}
.cin textarea{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-family:inherit;font-size:14px;color:var(--ink);resize:none;outline:none;min-height:48px;max-height:120px;background:var(--bg)}
.cin textarea:focus{border-color:var(--gold);background:#fff}
.send{width:48px;height:48px;border-radius:50%;background:var(--gold);color:#fff;border:none;font-size:18px;cursor:pointer;flex:none}
.send:hover{background:var(--gold2)}
.send:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;color:var(--mut);text-align:center;margin-top:10px}
@media(max-width:820px){.rail{display:none}.msg{max-width:88%}}
</style>
</helmet>
<div class="ai" style="{{ rootStyle }}">
<aside class="rail">
<div class="rbrand"><div class="ey">AI Automation</div><h1>AI Assistant Studio</h1><p>One engine, many jobs — switch a mode to see how a single AI concierge handles every touchpoint.</p></div>
<div class="rlab">Assistant Modes</div>
<sc-for list="{{ modes }}" as="m" hint-placeholder-count="6"><div class="{{ m.cls }}" onClick="{{ m.pick }}"><span class="mi">{{ m.ic }}</span><div class="mt"><div class="mn">{{ m.name }}</div><div class="md">{{ m.desc }}</div></div></div></sc-for>
</aside>
<div class="main">
<div class="chead"><span class="ci">{{ cur.ic }}</span><div><h2>{{ cur.name }}</h2><div class="cs"><span class="dot"></span>{{ statusText }}</div></div><span class="badge">{{ engineLabel }}</span></div>
<div class="thread" id="thread"><sc-for list="{{ thread }}" as="m" hint-placeholder-count="3"><div class="msg {{ m.cls }}"><sc-if value="{{ m.them }}" hint-placeholder-val="{{ true }}"><span class="av">✦</span></sc-if><div class="bub">{{ m.html }}</div></div></sc-for><sc-if value="{{ busy }}" hint-placeholder-val="{{ false }}"><div class="typing"><span class="av">✦</span><div class="bub"><i></i><i></i><i></i></div></div></sc-if></div>
<div class="composer"><div class="chips"><sc-for list="{{ suggestions }}" as="s" hint-placeholder-count="3"><span class="chip" onClick="{{ s.send }}">{{ s.label }}</span></sc-for></div><div class="cin" style="margin-top:12px"><textarea placeholder="{{ placeholder }}" value="{{ draft }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}"></textarea><button class="send" onClick="{{ send }}" disabled="{{ sendDisabled }}">➤</button></div><div class="hint">{{ hint }}</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:840},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9c6a34&quot;,&quot;options&quot;:[&quot;#9c6a34&quot;,&quot;#c2984f&quot;,&quot;#bd6980&quot;,&quot;#2a6f8a&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  state = { mode:'concierge', draft:'', busy:false, threads:{} };
  MODES=[
    ['concierge','Website Concierge','🌸','Greets visitors, answers anything about the studio'],
    ['faq','FAQ Bot','💬','Instant answers on pricing, timelines & process'],
    ['lead','Lead Qualifier','🎯','Asks smart questions, scores & routes new leads'],
    ['booking','Booking Assistant','📅','Guides visitors to book a consultation'],
    ['search','AI Portfolio Search','🔎','Finds the right work by describing a need'],
    ['kb','Knowledge Base','📚','Answers from docs, guides & past projects']
  ];
  GREET={
    concierge:"Hi, I'm Bloom — Sharon Rose Studio's AI concierge. 🌸 I can tell you about our services, pricing, or help you start a project. What brings you here today?",
    faq:"Hi! I'm the FAQ assistant. Ask me anything about pricing, timelines, revisions, or how we work — I'll answer instantly.",
    lead:"Welcome! I'll ask a few quick questions to understand your project so Sharon can prepare the perfect proposal. First — what type of business do you run?",
    booking:"Happy to help you book a free consultation! 📅 Are you interested in a website, automation, an AI chatbot, or the complete package?",
    search:"Describe what you're looking for and I'll surface the most relevant work — e.g. 'a booking system for a clinic' or 'an events brand with online payments'.",
    kb:"I'm connected to the studio knowledge base. Ask about our process, tech stack, deployment, or anything from past project docs."
  };
  SUG={
    concierge:['What services do you offer?','How much is a website?','I want to start a project'],
    faq:['What’s your pricing?','How long does a website take?','Do you offer revisions?'],
    lead:['I run a coffee shop','I need more customers','What info do you need?'],
    booking:['Complete package','Just a website','How does a consult work?'],
    search:['Booking system for a clinic','An events brand with payments','A dashboard with analytics'],
    kb:['What’s your tech stack?','How do you deploy?','Do you use n8n?']
  };
  KB={
    'services':"We offer 6 core services: Website Development (₱12K), Blog sites (₱7K), Email Automation (₱10K), AI Chatbots (₱15K), Digital Wedding Invitations (₱5K), and a Complete Business Package (₱25K) that bundles website + blog + email automation + AI chatbot.",
    'price':"Starting rates: Website ₱12,000 · Blog ₱7,000 · Email Automation ₱10,000 · AI Chatbot ₱15,000 · Wedding Invitation ₱5,000 · Complete Package ₱25,000. Every project is tailored — I can prepare an exact quote once I know your goals.",
    'timeline':"Typical timelines: a landing site 1–2 weeks, a full website 2–4 weeks, automation & chatbots 1–2 weeks. Complete packages run 4–6 weeks. Rush options are available.",
    'revision':"Yes — every package includes revision rounds so we refine until it's right. We review together at design and pre-launch stages.",
    'stack':"We build on Next.js 15, React, TypeScript and Tailwind, with Supabase (Postgres, Auth, Storage) for the backend, n8n for automation, and OpenAI/Claude for AI features. Deployed on Vercel or Netlify.",
    'deploy':"Everything ships GitHub-ready and deploys to Vercel or Netlify with zero build errors. You get your own domain, and forms/automation are wired to real services.",
    'n8n':"Yes — we orchestrate automations in n8n: inquiry→CRM→email journeys, payment verification→invoice/receipt, review requests and newsletters, each with retry logic and logging.",
    'book':"Wonderful! You can book a free 30-minute consultation on Sharon's Calendly, or message her on WhatsApp at +63 936 903 7613. Would you like the link?",
    'contact':"You can reach Sharon at sharonrosealgara@gmail.com, on WhatsApp (+63 936 903 7613), or book directly via Calendly. Shall I point you to the booking page?"
  };
  pick(m){ this.setState({mode:m,draft:''}); this.scrollSoon(); }
  onInput(e){ this.setState({draft:e.target.value}); }
  onKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this.send(); } }
  quickSend(text){ this.setState({draft:text}, ()=>this.send()); }
  scrollSoon(){ setTimeout(()=>{ try{ const t=document.getElementById('thread'); if(t) t.scrollTop=t.scrollHeight; }catch(_){}} ,60); }
  reply(userText){
    const m=this.state.mode; const q=userText.toLowerCase();
    const kb=this.KB;
    const has=(...w)=>w.some(x=>q.includes(x));
    let a;
    if(has('price','pricing','cost','how much','rate')) a=kb.price;
    else if(has('service','offer','do you do','what can you')) a=kb.services;
    else if(has('how long','timeline','time','weeks','turnaround')) a=kb.timeline;
    else if(has('revision','changes','edit')) a=kb.revision;
    else if(has('stack','tech','built','framework','next')) a=kb.stack;
    else if(has('deploy','host','live','domain','vercel','netlify')) a=kb.deploy;
    else if(has('n8n','automat','workflow')) a=kb.n8n;
    else if(has('book','consult','call','schedule','meeting','appointment')) a=kb.book;
    else if(has('contact','email','whatsapp','reach','message')) a=kb.contact;
    else if(m==='lead') a="Great — thanks! That helps a lot. What's your main goal right now: more customers, saving time with automation, or a stronger online presence? (I'll route this straight to Sharon with a project score.)";
    else if(m==='search') a="Based on that, the closest work in the portfolio is the Shawie Bakes platform (booking + payments + client portal) and the BrewBloom Coffee site (ordering + loyalty). Want me to open one, or find something else?";
    else if(m==='booking') a="Perfect choice! A free consultation is the best next step — Sharon will map out scope, timeline and a fixed quote. You can grab a slot on Calendly or message +63 936 903 7613. Want the booking link?";
    else if(m==='concierge') a="Great question! Sharon Rose Studio designs and builds complete business systems — websites, automation, AI chatbots and dashboards. Tell me a bit about your business and I'll point you to exactly what fits. 🌸";
    else a="I've noted that. Sharon can give you a precise answer — would you like to book a quick call or see related work?";
    return a;
  }
  async send(){
    const text=(this.state.draft||'').trim(); if(!text||this.state.busy) return;
    const m=this.state.mode;
    const cur=(this.state.threads[m]||[]).concat([{role:'user',text}]);
    this.setState(s=>({threads:{...s.threads,[m]:cur},draft:'',busy:true})); this.scrollSoon();
    let answer=null;
    try{
      if(window.claude && window.claude.complete){
        const sys=`You are the AI assistant for Sharon Rose · Digital Solutions Studio (web design, automation, AI, based in the Philippines). Current mode: ${m}. Be warm, concise (2-4 sentences), professional. Services & rates: Website ₱12K, Blog ₱7K, Email Automation ₱10K, AI Chatbot ₱15K, Wedding Invitation ₱5K, Complete Package ₱25K. Stack: Next.js, Supabase, n8n, OpenAI/Claude, Vercel/Netlify. Contact: sharonrosealgara@gmail.com, WhatsApp +63 936 903 7613, Calendly for bookings. Encourage booking a free consult when relevant.`;
        const hist=cur.map(x=>(x.role==='user'?'Visitor: ':'Assistant: ')+x.text).join('\n');
        answer=await window.claude.complete(sys+'\n\n'+hist+'\nAssistant:');
      }
    }catch(_){}
    if(!answer) answer=this.reply(text);
    setTimeout(()=>{ this.setState(s=>({threads:{...s.threads,[m]:(s.threads[m]||[]).concat([{role:'bot',text:answer}])},busy:false})); this.scrollSoon(); }, 650);
  }
  fmt(t){ return String(t).split(/\n+/).map((p,i)=>React.createElement('p',{key:i},p)); }
  renderVals(){
    const S=this.state, m=S.mode;
    const accent=this.props.accent; const rootStyle=accent?{'--gold':accent}:{};
    const meta=this.MODES.find(x=>x[0]===m);
    const modes=this.MODES.map(x=>({name:x[1],desc:x[3],ic:x[2],cls:x[0]===m?'mode on':'mode',pick:()=>this.pick(x[0])}));
    const raw=S.threads[m]||[{role:'bot',text:this.GREET[m]}];
    const thread=raw.map(x=>({cls:x.role==='user'?'me':'them',them:x.role!=='user',html:this.fmt(x.text)}));
    const suggestions=(this.SUG[m]||[]).map(s=>({label:s,send:()=>this.quickSend(s)}));
    const engineLabel = (typeof window!=='undefined' && window.claude && window.claude.complete) ? 'Live · Claude' : 'Demo mode';
    return {
      rootStyle, modes,
      cur:{name:meta[1],ic:meta[2]},
      statusText:'Online · replies in seconds', engineLabel,
      thread, busy:S.busy, suggestions,
      draft:S.draft, onInput:(e)=>this.onInput(e), onKey:(e)=>this.onKey(e), send:()=>this.send(), sendDisabled:!S.draft.trim()||S.busy,
      placeholder:'Message the '+meta[1]+'…',
      hint:'This assistant answers live when connected to Claude, with a smart scripted fallback otherwise.'
    };
  }
}
</script>
</body>
</html>
