<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wonder Journey OS · The Ferrell Family</title>
<meta name="description" content="Wonder Journey OS — a gamified family learning adventure through the Philippines. Learn together, explore together, grow together." />
<!-- Rounded child-friendly fonts (loads on hosted/local; falls back gracefully where blocked) -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0e7c86" />
<link rel="icon" href="assets/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --sand:#fbf3e6; --sand-2:#f4e7d2; --ink:#2b2015; --ink-soft:#6b5a44;
  --ocean:#0e7c86; --ocean-2:#12a3af; --sun:#f4a821; --sun-2:#ffca4b;
  --coral:#e5674f; --coral-2:#f0836d; --palm:#3f9d54; --palm-2:#5bbd6f;
  --grape:#7a5cc4; --card:#ffffff; --line:#eaddc7; --shadow:0 10px 30px rgba(70,45,15,.10);
  --shadow-lg:0 20px 50px rgba(70,45,15,.16); --radius:20px;
}
.dark{
  --sand:#191410; --sand-2:#221a12; --ink:#f6ecdd; --ink-soft:#c3b299;
  --card:#241b13; --line:#3a2c1d; --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--sand);color:var(--ink);
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.55;
}
h1,h2,h3,h4{font-family:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;font-weight:700;line-height:1.15;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}
a{color:var(--ocean);text-decoration:none}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{
  width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--ocean),#0a5f68);color:#fff;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:6px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .globe{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--sun),var(--coral));display:grid;place-items:center;font-size:24px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.brand b{font-family:'Baloo 2',sans-serif;font-size:18px;display:block;line-height:1.05}
.brand small{font-size:10px;opacity:.8;letter-spacing:.08em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:13px;font-weight:700;font-size:14.5px;color:rgba(255,255,255,.82);transition:.15s;width:100%;text-align:left}
.nav-item .ic{font-size:18px;width:22px;text-align:center}
.nav-item:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-item.active{background:#fff;color:var(--ocean);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.nav-spacer{flex:1}
.side-foot{font-size:11px;opacity:.75;padding:10px 8px;border-top:1px solid rgba(255,255,255,.15)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;position:sticky;top:0;background:color-mix(in srgb,var(--sand) 88%,transparent);backdrop-filter:blur(10px);z-index:20;border-bottom:1px solid var(--line)}
.topbar .menu-btn{display:none;font-size:22px}
.xp-wrap{flex:1;max-width:420px}
.xp-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:5px}
.xp-top .lvl{color:var(--ocean)}
.xp-bar{height:12px;background:var(--sand-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.topbar .chips{display:flex;gap:8px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-weight:800;font-size:13px;box-shadow:var(--shadow)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}

.view{padding:26px;max-width:1100px;width:100%;margin:0 auto;animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards & sections */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:30px;border-radius:26px;background:
  radial-gradient(120% 140% at 100% 0%, rgba(244,168,33,.22), transparent 55%),
  radial-gradient(110% 130% at 0% 100%, rgba(14,124,134,.20), transparent 55%),
  var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero h1{font-size:clamp(24px,4vw,36px)}
.hero p{color:var(--ink-soft);font-size:16px;margin-top:8px;max-width:640px}
.hero .wave{position:absolute;right:-10px;bottom:-24px;font-size:120px;opacity:.14;pointer-events:none;transform:rotate(-8deg)}

.grid{display:grid;gap:18px}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.section-title{display:flex;align-items:center;gap:10px;font-size:20px;margin:26px 0 14px}
.section-title .em{font-size:22px}

.stat{padding:18px;display:flex;flex-direction:column;gap:6px}
.stat .lbl{font-size:12.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:28px;font-weight:800;font-family:'Baloo 2',sans-serif}
.stat .em{font-size:24px;position:absolute;right:16px;top:16px;opacity:.85}
.stat{position:relative}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 22px;border-radius:14px;font-weight:800;font-size:15px;transition:.16s;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--coral),var(--coral-2));color:#fff}
.btn-ocean{background:linear-gradient(135deg,var(--ocean),var(--ocean-2));color:#fff}
.btn-sun{background:linear-gradient(135deg,var(--sun),var(--sun-2));color:#4a3410}
.btn-ghost{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* Adventure map */
.map{display:flex;flex-direction:column;gap:0;position:relative;padding:10px 0}
.node{display:flex;gap:18px;align-items:stretch;position:relative}
.node .rail{width:56px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.node .dot{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:#fff;box-shadow:var(--shadow);z-index:2;flex-shrink:0;border:3px solid var(--card)}
.node .line{width:5px;flex:1;background:var(--line);border-radius:99px;margin:2px 0}
.node:last-child .line{display:none}
.node .body{flex:1;padding-bottom:20px}
.adv-card{padding:18px 20px;border-radius:18px;display:flex;gap:16px;align-items:center;transition:.16s}
.adv-card.clickable{cursor:pointer}
.adv-card.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.adv-card .emoji{font-size:34px;flex-shrink:0}
.adv-card h3{font-size:17px}
.adv-card .meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.adv-card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--sand-2);color:var(--ink-soft)}
.locked{opacity:.6;filter:saturate(.5)}
.state-done{background:var(--palm)} .state-open{background:linear-gradient(135deg,var(--sun),var(--coral))} .state-lock{background:#b6a488}
.done-badge{margin-left:auto;color:var(--palm);font-weight:800;font-size:13px;display:flex;align-items:center;gap:5px;flex-shrink:0}

/* Adventure detail */
.back{display:inline-flex;align-items:center;gap:7px;font-weight:800;color:var(--ink-soft);margin-bottom:16px}
.lesson-hero{padding:26px;border-radius:24px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:8px}
.lesson-hero h1{font-size:clamp(22px,3.5vw,30px)}
.lesson-hero p{opacity:.92;margin-top:6px;max-width:640px}
.lesson-hero .big{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:96px;opacity:.22}
.subj{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.subj-head{display:flex;align-items:center;gap:13px;padding:16px 18px;cursor:pointer;user-select:none}
.subj-head .em{font-size:24px;width:30px;text-align:center}
.subj-head h3{font-size:16px;flex:1}
.subj-head .chev{transition:.2s;color:var(--ink-soft);font-size:18px}
.subj.open .chev{transform:rotate(90deg)}
.subj-body{display:none;padding:0 20px 20px 61px;font-size:15px}
.subj.open .subj-body{display:block;animation:fade .3s}
.subj-body p{margin:8px 0}
.subj-body ul{margin:8px 0 8px 18px}
.subj-body li{margin:5px 0}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.word{background:var(--sand-2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.word b{color:var(--ocean)} .dark .word b{color:var(--ocean-2)}
.callout{background:var(--sand-2);border-left:4px solid var(--sun);border-radius:12px;padding:12px 15px;margin:10px 0;font-size:14.5px}
.callout.faith{border-left-color:var(--grape)}
.callout.char{border-left-color:var(--coral)}
.tryit{background:color-mix(in srgb,var(--palm) 12%,transparent);border:1px dashed var(--palm);border-radius:12px;padding:12px 15px;margin:10px 0;font-size:14.5px}

/* Quiz */
.quiz{padding:22px}
.q{margin:18px 0}
.q .qt{font-weight:800;margin-bottom:10px;font-size:16px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border-radius:13px;border:2px solid var(--line);background:var(--card);margin:8px 0;font-weight:700;font-size:15px;transition:.13s}
.opt:hover{border-color:var(--ocean)}
.opt.correct{border-color:var(--palm);background:color-mix(in srgb,var(--palm) 16%,transparent)}
.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,transparent)}
.opt.dim{opacity:.55}

/* Passport & badges */
.passport-grid,.badge-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.stamp{aspect-ratio:1;border-radius:18px;border:3px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;background:var(--card)}
.stamp.got{border-style:solid;border-color:var(--coral);background:color-mix(in srgb,var(--coral) 8%,var(--card));box-shadow:var(--shadow)}
.stamp .em{font-size:40px;filter:grayscale(1);opacity:.4}
.stamp.got .em{filter:none;opacity:1}
.stamp small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.badge{padding:18px;text-align:center;border-radius:18px}
.badge .ring{width:74px;height:74px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:36px;background:var(--sand-2);border:3px solid var(--line)}
.badge.got .ring{background:linear-gradient(135deg,var(--sun),var(--coral));border-color:transparent;box-shadow:0 8px 20px rgba(229,103,79,.35)}
.badge.got .ring{filter:none} .badge:not(.got) .ring{filter:grayscale(1);opacity:.5}
.badge h4{font-size:14.5px} .badge p{font-size:12px;color:var(--ink-soft);margin-top:3px}

/* Family */
.fam-card{padding:20px;text-align:center;border-radius:20px}
.fam-card .av{width:76px;height:76px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:38px;color:#fff;box-shadow:var(--shadow)}
.fam-card h3{font-size:17px} .fam-card .role{font-size:12px;color:var(--ink-soft);font-weight:800;text-transform:uppercase;letter-spacing:.04em}

/* Tree */
.tree-wrap{text-align:center;padding:24px}
.tree{font-size:96px;line-height:1;transition:.4s;filter:drop-shadow(0 8px 12px rgba(63,157,84,.3))}
.tree-track{display:flex;justify-content:space-between;gap:6px;margin:18px auto;max-width:520px}
.tree-step{flex:1;height:8px;border-radius:99px;background:var(--sand-2)}
.tree-step.on{background:linear-gradient(90deg,var(--palm),var(--palm-2))}

/* Settings */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{font-weight:800;font-size:14px}
.field input,.field select{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--card)}
.toggle-row .t-txt b{display:block} .toggle-row .t-txt small{color:var(--ink-soft)}
.sw{width:52px;height:30px;border-radius:99px;background:var(--sand-2);border:1px solid var(--line);position:relative;transition:.2s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--palm)} .sw.on::after{left:27px}
.fam-editor{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.fam-editor input{flex:1}
.fam-editor .del{color:var(--coral);font-size:20px;padding:6px 10px}

/* Modal / celebration */
.modal-bg{position:fixed;inset:0;background:rgba(20,12,4,.55);display:none;place-items:center;z-index:100;padding:20px;animation:fade .25s}
.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:26px;padding:34px 28px;max-width:400px;width:100%;text-align:center;box-shadow:var(--shadow-lg);animation:pop .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal .burst{font-size:64px;animation:spin 1s ease}
@keyframes spin{from{transform:rotate(-20deg) scale(.5)}to{transform:none}}
.modal h2{margin:10px 0 6px;font-size:24px}
.modal p{color:var(--ink-soft);margin-bottom:8px}
.reward-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.reward{background:var(--sand-2);border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px}
.confetti{position:fixed;top:-10px;width:11px;height:11px;z-index:99;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(104vh) rotate(720deg);opacity:.6}}

/* Reflection */
.reflect textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);resize:vertical}

.empty{text-align:center;padding:50px 20px;color:var(--ink-soft)}
.empty .em{font-size:52px;opacity:.5}

/* ===== Cinematic Presentation Mode ===== */
#cinema{position:fixed;inset:0;z-index:200;display:none;color:#2b2015;overflow:hidden;background:#bfe6f5}
#cinema.show{display:block}
.cine-sky{position:absolute;inset:0;background:linear-gradient(180deg,#7ec9ef 0%,#a6ddf5 40%,#cfeaf7 58%,#eaf6df 63%,#f3e7c9 76%,#e6d0a2 100%)}
.cine-cloud{position:absolute;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));border-radius:50%;filter:blur(6px);opacity:.5;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}
.cine-waves{position:absolute;left:0;right:0;bottom:0;height:26vh;background:
  radial-gradient(120% 80% at 50% 100%, rgba(255,255,255,.10), transparent 60%);pointer-events:none}
.cine-waves::before,.cine-waves::after{content:"";position:absolute;left:-50%;right:-50%;bottom:0;height:60px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 40px,transparent 40px 80px);border-radius:50%;animation:wave 7s linear infinite}
.cine-waves::after{bottom:22px;opacity:.5;animation-duration:11s;animation-direction:reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(80px)}}
.cine-spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe08a;box-shadow:0 0 8px 2px rgba(255,224,138,.8);animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}

.cine-stage{position:absolute;inset:0;display:grid;place-items:center;padding:6vh 6vw 14vh;overflow-y:auto}
.scene{max-width:900px;width:100%;text-align:center;animation:sceneIn .55s cubic-bezier(.2,.85,.25,1)}
.scene.zoom{animation:sceneZoom .6s cubic-bezier(.2,.85,.25,1)}
@keyframes sceneIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes sceneZoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.scene .kicker{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#b0741f;margin-bottom:14px}
.scene h1{font-family:'Fredoka','Baloo 2',sans-serif;font-size:clamp(30px,6vw,62px);line-height:1.05;text-wrap:balance;color:#0e7c86;text-shadow:2px 2px 0 #fff,0 6px 16px rgba(0,0,0,.12)}
.scene .big-emoji{font-size:clamp(60px,12vw,120px);filter:drop-shadow(0 10px 20px rgba(0,0,0,.2));animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.scene p.lead{font-size:clamp(18px,2.4vw,24px);color:#2b2015;max-width:680px;margin:16px auto 0;line-height:1.5}
.scene .glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:24px 26px;backdrop-filter:blur(8px);text-align:left;max-height:56vh;overflow-y:auto}
.scene .glass h2{font-family:'Baloo 2',sans-serif;font-size:24px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.scene .glass :is(p,li){font-size:16.5px;line-height:1.6}
.scene .glass .tryit,.scene .glass .callout,.scene .glass .wordbank .word{color:#08131a}
.scene .glass .word b{color:#0e7c86}

/* archipelago */
.archi{position:relative;width:min(78vw,540px);aspect-ratio:1;margin:6px auto 0}
.archi .globe{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2bbecb,#0e7c86 70%,#0a4f66);box-shadow:inset -20px -24px 60px rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.4);animation:globeIn 1.1s cubic-bezier(.2,.9,.2,1)}
@keyframes globeIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.isle{position:absolute;cursor:pointer;border:none;background:linear-gradient(160deg,#4bbf68,#2f8f4c);border-radius:46% 54% 58% 42%/54% 46% 58% 46%;opacity:0;box-shadow:0 6px 18px rgba(0,0,0,.35);animation:isleGlow .8s forwards;transition:transform .2s}
.isle:hover{transform:scale(1.06)}
.isle:focus-visible{outline:3px solid #ffca4b;outline-offset:3px}
@keyframes isleGlow{from{opacity:0;transform:scale(.6);filter:brightness(2)}to{opacity:1;transform:scale(1);filter:brightness(1)}}
.isle .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(11px,1.7vw,15px);color:#08351a;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.5);pointer-events:none}
.isle-luzon{width:30%;height:34%;left:30%;top:8%;animation-delay:1s}
.isle-visayas{width:26%;height:22%;left:44%;top:44%;animation-delay:1.8s}
.isle-mindanao{width:32%;height:30%;left:36%;top:64%;animation-delay:2.6s}
.archi-hint{margin-top:16px;font-size:15px;color:#2b2015;font-weight:700}

/* quiz in cinema (warm cards) */
.cine-opt{display:block;width:100%;max-width:600px;margin:12px auto;padding:16px 22px;border-radius:16px;border:2px solid #ecdcbd;background:#fff;color:#2b2015;font-weight:800;font-size:clamp(17px,2vw,21px);transition:.15s;box-shadow:0 4px 0 #ecdcbd}
.cine-opt:hover{background:#fff6e6;border-color:#0e7c86}
.cine-opt.correct{border-color:#3f9d54;background:#e7f6ea}
.cine-opt.wrong{border-color:#e5674f;background:#fdeeea}
.reward-pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.reward-pills>span{background:#fff5df;border:2px solid #e8c37a;border-radius:14px;padding:10px 16px;font-weight:800;color:#5a4420}

.cine-controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:16px 22px;background:linear-gradient(0deg,rgba(0,0,0,.4),transparent)}
.cine-btn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:20px;display:grid;place-items:center;transition:.15s;backdrop-filter:blur(6px)}
.cine-btn:hover{background:rgba(255,255,255,.28)}
.cine-btn:disabled{opacity:.35}
.cine-dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-height:40px;overflow:hidden}
.cine-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3);transition:.2s}
.cine-dot.on{background:#ffca4b;transform:scale(1.35)}
.cine-dot.done{background:rgba(255,255,255,.6)}
.cine-top{position:absolute;top:16px;right:18px;display:flex;gap:10px;z-index:2}
.cine-scene-label{position:absolute;top:20px;left:22px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
@media (prefers-reduced-motion: reduce){
  .cine-cloud,.cine-waves::before,.cine-waves::after,.cine-spark,.scene,.scene.zoom,.scene .big-emoji,.archi .globe,.isle{animation:none !important}
  .isle{opacity:1}
}

/* ===== Storybook paper lesson card (reference look) ===== */
.paper{position:relative;background:#fbf3e6;color:#2b2015;border-radius:28px;padding:30px 30px 26px;box-shadow:0 22px 55px rgba(0,0,0,.34);text-align:left;max-height:62vh;overflow:auto;border:3px solid #fff}
.paper::before{content:"";position:absolute;inset:12px;border:2px dashed #d9c3a0;border-radius:20px;pointer-events:none}
.paper-inner{position:relative}
.signpost{display:inline-flex;align-items:center;gap:9px;background:linear-gradient(180deg,#caa063,#a97b3f);color:#fff;font-family:'Fredoka','Baloo 2',sans-serif;font-weight:700;padding:9px 20px;border-radius:14px;box-shadow:0 5px 0 #7d5a2c,0 12px 18px rgba(0,0,0,.22);letter-spacing:.1em;text-transform:uppercase;font-size:14px;margin-bottom:16px}
.paper h2.title{font-family:'Fredoka','Baloo 2',sans-serif;color:#0e7c86;font-size:clamp(30px,5vw,52px);line-height:1.05;margin:2px 0 14px;text-shadow:2px 2px 0 #fff}
.paper :is(p,li){font-size:clamp(18px,2.1vw,25px);line-height:1.55;color:#2b2015}
.paper ul{list-style:none;padding-left:2px;margin:10px 0}
.paper ul li{position:relative;padding-left:36px;margin:12px 0}
.paper ul li::before{content:"⭐";position:absolute;left:0;top:2px;font-size:20px}
.paper ol{padding-left:26px} .paper ol li{margin:10px 0}
.paper b{color:#0e7c86}
.paper .tryit{background:#fff5df;border:2px dashed #e0a93f;border-radius:16px;padding:14px 18px;margin:14px 0;color:#5a4420;font-size:clamp(16px,2vw,22px)}
.paper .callout{background:#eef7f4;border-left:5px solid #0e7c86;border-radius:14px;padding:14px 18px;margin:12px 0;color:#233}
.paper .callout.faith{border-left-color:#7a5cc4;background:#f2edfb}
.paper .callout.char{border-left-color:#e5674f;background:#fdeeea}
.paper .wordbank{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}
.paper .word{background:#fff;border:2px solid #ecdcbd;border-radius:14px;padding:9px 14px;font-size:clamp(15px,1.8vw,20px);color:#2b2015;box-shadow:0 3px 0 #ecdcbd}
.paper .word b{color:#0e7c86}
.paper-tier{margin:0 0 16px} .paper-tier b{color:#0e7c86;font-size:clamp(17px,2vw,22px)}

/* keyword highlight colors + colored star bullets (reference look) */
.hl-blue{color:#2f7fd6;font-weight:800}.hl-red{color:#e5486a;font-weight:800}.hl-green{color:#3f9d54;font-weight:800}
.hl-purple{color:#7a5cc4;font-weight:800}.hl-orange{color:#e0862f;font-weight:800}.hl-teal{color:#0e7c86;font-weight:800}.hl-pink{color:#d6559a;font-weight:800}
.paper ul.stars{list-style:none;padding-left:2px}
.paper ul.stars li{padding-left:38px}
.paper ul.stars li::before{content:none}
.paper ul.stars li .bstar{position:absolute;left:0;top:2px;font-size:22px;line-height:1}

/* bright tropical environment (lesson scenes) */
#cinema .cine-sky.bright{background:linear-gradient(180deg,#7ec9ef 0%,#a6ddf5 40%,#cfeaf7 58%,#eaf6df 63%,#f3e7c9 76%,#e6d0a2 100%)}
.cine-palm{position:absolute;left:-16px;top:-14px;font-size:150px;transform-origin:top left;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18));animation:sway 6s ease-in-out infinite;z-index:1;pointer-events:none}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-1deg)}}
.cine-ocean{position:absolute;left:0;right:0;bottom:0;height:19vh;background:linear-gradient(180deg,rgba(91,183,224,0),#69b9e2 45%,#3f9ed0);pointer-events:none;z-index:1}
.cine-ocean::before{content:"";position:absolute;top:6px;left:-20%;right:-20%;height:16px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 34px,transparent 34px 68px);border-radius:50%;animation:wave 8s linear infinite}
.cine-ground{position:absolute;left:0;right:0;bottom:0;height:16vh;z-index:1;pointer-events:none}
.cine-decor{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12));animation:floaty ease-in-out infinite;opacity:.92}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-16px) rotate(5deg)}}
@media (prefers-reduced-motion: reduce){.cine-decor{animation:none}}

/* scene label as kraft ribbon */
.cine-scene-label{background:linear-gradient(180deg,#efe0c2,#e2cfa4);color:#6b5227;padding:8px 15px;border-radius:9px;box-shadow:0 4px 0 #c9b184,0 8px 12px rgba(0,0,0,.16);font-family:'Fredoka','Baloo 2',sans-serif;opacity:1;top:20px;left:130px;z-index:5}
@media(max-width:640px){.cine-scene-label{left:96px}.cine-palm{font-size:104px}}

/* lesson row (paper + pinned map postcard) */
.scene-lesson{display:flex;gap:22px;align-items:flex-start;justify-content:center;max-width:1120px;text-align:left}
.scene-lesson .paper{flex:1 1 0;min-width:0}
.postcard{flex:0 0 clamp(200px,26vw,300px);position:relative;background:#fff;border-radius:14px;padding:10px;box-shadow:0 16px 34px rgba(0,0,0,.28);transform:rotate(2.5deg)}
.postcard .tape{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);width:74px;height:24px;background:rgba(230,214,150,.75);border:1px dashed rgba(150,120,60,.4)}
.pc-map{border-radius:10px;overflow:hidden;aspect-ratio:2/3;background:#d6effa}
.postcard .rtag{position:absolute;font-family:'Fredoka','Baloo 2',sans-serif;font-weight:700;color:#fff;font-size:clamp(12px,1.5vw,15px);padding:3px 10px;border-radius:9px;box-shadow:0 3px 6px rgba(0,0,0,.2)}
.tag-luzon{top:20%;right:6%;background:#57b06a}
.tag-visayas{top:52%;right:2%;background:#7a5cc4}
.tag-mindanao{top:74%;right:10%;background:#e0862f}
@media(max-width:820px){.scene-lesson{flex-direction:column;align-items:center}.postcard{transform:none;flex-basis:auto;width:min(70vw,280px)}}

/* controls: brown nav arrows + star at end of dots */
.cine-btn.cine-nav{width:58px;height:58px;background:linear-gradient(180deg,#b07d43,#8a5f2e);border-color:#7d5527;color:#fff;box-shadow:0 5px 0 #6f4a22,0 10px 16px rgba(0,0,0,.25);font-size:24px}
.cine-btn.cine-nav:hover{background:linear-gradient(180deg,#bd8949,#986834)}
.cine-dots .dot-star{font-size:15px;line-height:1;color:#ffca4b;margin-left:2px}
.cine-top .cine-btn.spk{background:#2f7fd6;border-color:#2f7fd6}
.cine-top .cine-btn.xbtn{background:linear-gradient(180deg,#f7b733,#e8902b);border-color:#e8902b}
.title-spark{color:#ffca4b}

/* resilient educational media (see MEDIA_POLICY.md) */
.wj-figure{margin:14px 0 0;position:relative}
.wj-figure img{display:block;width:100%;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.wj-figure-fallback{display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:#eef7f4;border:2px dashed #bcd8cf;border-radius:14px;padding:20px;color:#3a5;min-height:120px}
.wj-figure-fallback .fb-emoji{font-size:34px}.wj-figure-fallback b{color:#2b5}.wj-figure-fallback small{color:#6b8}
.wj-figure.missing img{display:none}

.wj-teachernote{font-size:12px;color:#8a5a2c;margin-top:4px;text-align:center;font-style:italic;background:#fff6e6;border:1px dashed #e6c98c;border-radius:10px;padding:6px 8px}
.wj-fig-badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:999px;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.wj-fig-badge.real{background:#0e9c86}
.wj-fig-badge.illus{background:#c07cc0}
.media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:8px}
.media-grid .wj-figure{margin:0}
.media-grid .wj-figure img{min-height:120px;object-fit:cover;aspect-ratio:4/3}
.kids-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:10px}
.kid-card{background:#fff;border:2px solid var(--kc,#ddd);border-top:7px solid var(--kc,#ddd);border-radius:16px;padding:12px 14px 14px;box-shadow:0 6px 16px rgba(0,0,0,.1);text-align:left}
.kid-card .kid-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kid-card .kid-ic{font-size:30px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.kid-card .kid-top b{display:block;font-family:'Baloo 2',sans-serif;font-size:17px;color:var(--kc,#333)}
.kid-card .kid-top small{color:#8a7a66;font-size:12px;font-weight:700}
.kid-card p{margin:0;font-size:14.5px;color:#4a3c28;line-height:1.45}
/* Celebrations page */
.mile-track{display:flex;gap:8px;justify-content:space-between;margin:14px 0 8px;flex-wrap:wrap}
.mile{flex:1;min-width:82px;text-align:center;padding:12px 6px;border-radius:14px;background:var(--card,#fff);border:2px solid rgba(0,0,0,.06);opacity:.55;filter:grayscale(.5);transition:.2s}
.mile.on{opacity:1;filter:none;border-color:#f4a821;box-shadow:0 6px 14px rgba(244,168,33,.22)}
.mile-ic{font-size:26px;display:block;line-height:1}
.mile small{display:block;margin-top:5px;font-size:11.5px;font-weight:700;color:var(--ink-soft,#7a6a55)}
.badge-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.badge-chip{display:inline-flex;align-items:center;gap:6px;background:var(--card,#fff);border:2px solid #ffe0a6;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink,#4a3c28);box-shadow:0 3px 8px rgba(0,0,0,.07)}
.badge-chip span{font-size:17px}
.timeline{position:relative;margin-top:12px;padding-left:8px}
.timeline:before{content:"";position:absolute;left:26px;top:8px;bottom:8px;width:3px;background:linear-gradient(#ffd98a,#f4a821);border-radius:3px}
.tl-item{position:relative;display:flex;gap:14px;align-items:flex-start;padding:8px 0}
.tl-dot{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--card,#fff);border:3px solid #f4a821;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:1;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.tl-body{flex:1;background:var(--card,#fff);border:2px solid rgba(0,0,0,.06);border-radius:14px;padding:10px 14px;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tl-top b{font-family:'Baloo 2',sans-serif;font-size:15.5px;color:var(--ink,#3a2c18)}
.tl-date{font-size:12px;font-weight:700;color:var(--ink-soft,#9a8a70);white-space:nowrap}
.tl-body small{color:var(--ink-soft,#7a6a55);font-size:13px}
/* Sidebar group label */
.nav-group{margin:14px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55)}
/* Toast */
.wj-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#2c3a2f;color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.28s;z-index:9999}
.wj-toast.show{opacity:1;transform:translate(-50%,0)}
/* Teacher Portal — lesson cards */
.lesson-card{background:var(--card,#fff);border:2px solid rgba(0,0,0,.07);border-radius:16px;margin:0;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.lesson-card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;font-family:'Baloo 2',sans-serif}

.lp-mats ul,.lp-special ul{margin:0;padding-left:18px}
.lp-mats li,.lp-special li{font-size:13.5px;color:var(--ink-soft,#5a4a35);margin:2px 0}
.lp-special{margin-top:10px;background:#fff6e6;border:1px dashed #e6c98c;border-radius:10px;padding:8px 10px}
.lp-special b{font-size:13px}
.lp-kid{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink,#4a3c28);margin:5px 0}

.lp-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.lp-soon{font-size:12.5px;color:var(--ink-soft,#8a7a66);font-style:italic}

.prog-hero{display:flex;align-items:center;gap:22px;padding:20px;flex-wrap:wrap}
.prog-ring{position:relative;--pct:0;width:96px;height:96px;border-radius:50%;flex:0 0 auto;background:conic-gradient(#f4a821 calc(var(--pct)*1%),rgba(0,0,0,.08) 0);display:flex;align-items:center;justify-content:center}

.prep-chips{display:flex;flex-wrap:wrap;gap:8px}

.cooking-hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#fff2dc,#ffe4c0);border:2px solid #f0c890;border-radius:18px;padding:18px 20px;box-shadow:0 8px 20px rgba(180,120,40,.14)}

.studio-board{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#8a5a34,#6e4626);color:#fff8ec;border-radius:16px;padding:16px 20px;box-shadow:0 10px 24px rgba(90,50,20,.3);background-image:linear-gradient(135deg,rgba(255,255,255,.06),transparent),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 14px)}

.cook-cols{margin-top:16px}
.studio-card{background:var(--card,#fff);border:2px solid rgba(0,0,0,.06);border-radius:16px;padding:16px 18px;margin-top:14px;box-shadow:0 5px 14px rgba(0,0,0,.07)}

.cq-opt.wrong{background:#fde8e4;border-color:#e5674f;color:#c0442e}
.cq-score{margin-top:8px;font-size:15px;font-weight:700;color:#0e7c86}
.cook-finish{text-align:center;margin:22px 0 8px}
/* completion modal fields */
.cc-field{text-align:left;margin:10px 0}
.cc-field label{display:block;font-size:13px;font-weight:700;color:var(--ink-soft,#7a6a55);margin-bottom:4px}
.cc-field input{width:100%;padding:9px 12px;border:2px solid #e6d5b8;border-radius:10px;font-family:inherit;font-size:14px}
.star-row{font-size:28px;letter-spacing:4px;cursor:pointer;color:#ddd}
.star-row .star.on{color:#f4b400}
.who-row{display:flex;flex-wrap:wrap;gap:8px}
.who-chip{display:inline-flex;align-items:center;gap:5px;background:#f4ead6;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
/* Cookbook keepsake pages */
.cookbook-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.cookbook-page{position:relative;background:linear-gradient(180deg,#fffdf7,#fdf3e2);border:1px solid #e8d6b6;border-radius:14px;padding:16px;box-shadow:0 6px 16px rgba(120,90,40,.14)}
.cookbook-page .cbp-tape{position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);width:70px;height:18px;background:rgba(230,200,140,.6);border:1px solid rgba(200,160,90,.4)}
.cbp-head{display:flex;align-items:center;gap:10px}
.cbp-emoji{font-size:34px}
.cbp-head h3{margin:0;font-size:16px}
.cbp-meta{font-size:12px;color:var(--ink-soft,#8a7a60)}
.cbp-rating{margin-left:auto;color:#f4b400;font-size:14px;letter-spacing:1px}
.cbp-photo{margin:10px 0}
.cbp-row{font-size:13.5px;color:var(--ink,#4a3c28);margin:4px 0}
.cbp-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cbp-chip{background:#fff;border:1.5px solid #ecd9b0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;color:#7a5a2c}
/* Sound Studio sliders */
.snd-slider{display:flex;align-items:center;gap:12px;margin:10px 0}
.snd-slider label{flex:0 0 190px;font-size:13.5px;font-weight:700;color:var(--ink,#4a3c28)}
.snd-slider input[type=range]{flex:1;accent-color:#f4a821;height:6px}
/* Media Library manager */
.ml-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ml-bar input{flex:2;min-width:200px;padding:10px 14px;border:2px solid #e6d5b8;border-radius:12px;font-family:inherit;font-size:14px}
.ml-bar select{flex:1;min-width:130px;padding:10px;border:2px solid #e6d5b8;border-radius:12px;font-family:inherit;font-size:14px;background:var(--card,#fff)}
.ml-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ml-card{background:var(--card,#fff);border:2px solid rgba(0,0,0,.06);border-radius:14px;padding:12px;box-shadow:0 4px 10px rgba(0,0,0,.06)}
.ml-card .wj-figure{margin:0}
.ml-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ml-id{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--ink-soft,#8a7a60)}
.ml-chip{font-size:10.5px;font-weight:800;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#f4ead6;color:#7a5a2c}
.ml-chip.ok{background:#dff3ea;color:#0e9c86}.ml-chip.todo{background:#fde8e4;color:#c0442e}
.ml-lic{font-size:11.5px;color:var(--ink-soft,#8a7a60);margin-top:6px}
/* Lesson Builder + Teacher Dashboard */
.lb-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.cc-field textarea{width:100%;padding:9px 12px;border:2px solid #e6d5b8;border-radius:10px;font-family:inherit;font-size:14px;resize:vertical}
.cc-field select{width:100%;padding:9px 12px;border:2px solid #e6d5b8;border-radius:10px;font-family:inherit;font-size:14px;background:var(--card,#fff)}
.tdash{background:var(--card,#fff);border:2px solid rgba(0,0,0,.06);border-radius:16px;padding:14px 16px;margin:12px 0;box-shadow:0 5px 14px rgba(0,0,0,.07)}
.tdash-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft,#6a5a45);margin-bottom:10px}
.tdash-stats b{color:var(--ink,#3a2c18)}
.tdash-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ===== Premium polish pass (docs/34) — deepen the adventure-journal identity ===== */
/* Cinematic Home hero: layered tropical scenery behind the same content */
.hero{min-height:250px}
.hero>*:not(.hero-scene){position:relative;z-index:2}
.hero-scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:0}
.hs-sun{position:absolute;top:-46px;right:8%;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,110,.55),rgba(255,214,110,.18) 55%,transparent 72%);animation:hsGlow 7s ease-in-out infinite}
@keyframes hsGlow{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.hs-cloud{position:absolute;background:rgba(255,255,255,.75);border-radius:999px;filter:blur(1.5px);box-shadow:22px 8px 0 6px rgba(255,255,255,.6),-20px 10px 0 4px rgba(255,255,255,.5);animation:hsDrift linear infinite}
@keyframes hsDrift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw))}}
.hs-ocean{position:absolute;left:0;right:0;bottom:0;height:52px;background:linear-gradient(180deg,rgba(94,197,224,.24),rgba(14,124,134,.30));border-radius:0 0 inherit inherit}
.hs-ocean:before{content:"";position:absolute;top:-7px;left:0;right:0;height:14px;background:radial-gradient(14px 10px at 14px 12px,rgba(255,255,255,.55) 42%,transparent 47%) repeat-x;background-size:36px 14px;animation:hsWave 9s linear infinite;opacity:.7}
@keyframes hsWave{from{background-position-x:0}to{background-position-x:72px}}
.hs-palm{position:absolute;bottom:6px;right:26px;font-size:74px;transform-origin:bottom center;animation:hsSway 6.5s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
@keyframes hsSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.hs-bird{position:absolute;font-size:15px;opacity:.75;animation:hsFly linear infinite}
@keyframes hsFly{from{transform:translate(-40px,8px)}to{transform:translate(110vw,-16px)}}
.hs-boat{position:absolute;bottom:16px;font-size:24px;animation:hsBoat 26s linear infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
@keyframes hsBoat{from{transform:translateX(-50px) rotate(-2deg)}45%{transform:translateX(45vw) rotate(2deg)}to{transform:translateX(105vw) rotate(-2deg)}}
/* Warm living background on the content area */
.main{background-image:radial-gradient(60% 40% at 85% -5%,rgba(244,168,33,.07),transparent 60%),radial-gradient(50% 35% at -5% 30%,rgba(14,124,134,.06),transparent 60%),radial-gradient(45% 30% at 60% 110%,rgba(229,103,79,.05),transparent 60%)}
/* Premium sidebar: selection indicator + gentle hover motion */
.nav-item{position:relative}
.nav-item:before{content:"";position:absolute;left:-13px;top:22%;bottom:22%;width:4px;border-radius:4px;background:#ffd66e;transform:scaleY(0);transition:transform .22s ease}
.nav-item:hover{transform:translateX(3px)}
.nav-item.active:before{transform:scaleY(1)}
.nav-item .ic{transition:transform .2s ease}
.nav-item:hover .ic{transform:scale(1.15) rotate(-4deg)}
/* Story cards: soft depth + collectible hover lift */
.card,.recipe-card,.lesson-card,.kid-card,.ml-card,.cookbook-page{transition:transform .18s ease,box-shadow .18s ease}
.card:hover,.cookbook-page:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(90,60,20,.13)}
/* Micro-interactions: buttons feel tactile */
.btn:hover{transform:translateY(-1.5px);filter:brightness(1.04)}
.btn:active{transform:translateY(0) scale(.97)}
.stat .em{transition:transform .2s ease}
.stat:hover .em{transform:scale(1.18) rotate(6deg)}
/* Accessibility: honor reduced motion for every polish animation */
@media (prefers-reduced-motion: reduce){
  .hs-sun,.hs-cloud,.hs-palm,.hs-bird,.hs-boat,.hs-ocean:before{animation:none !important}
  .nav-item:hover,.card:hover,.btn:hover,.cookbook-page:hover{transform:none}
}
/* Certificates */
#certOverlay{position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:24px;overflow:auto;background:rgba(30,40,35,.72);backdrop-filter:blur(3px)}
#certOverlay.show{display:flex}
.cert-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert{width:min(900px,96vw);aspect-ratio:1.414/1;background:linear-gradient(135deg,#fffdf6,#fdf3dd);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.4);padding:18px}
.cert-inner{height:100%;border:3px double #c9a24b;border-radius:8px;padding:5% 7%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;background:
  radial-gradient(circle at 12% 12%,rgba(201,162,75,.12),transparent 40%),
  radial-gradient(circle at 88% 88%,rgba(201,162,75,.12),transparent 40%)}
.cert-seal{font-size:clamp(38px,7vw,68px);line-height:1}
.cert-kicker{margin-top:6px;font-size:clamp(10px,1.4vw,14px);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a9863c}
.cert-heading{font-family:'Baloo 2',cursive;font-size:clamp(26px,5vw,52px);color:#2c3a2f;margin:8px 0 2px;line-height:1.05}
.cert-present{font-size:clamp(12px,1.7vw,17px);color:#6a5a45;margin:10px 0 4px}
.cert-names{font-family:'Baloo 2',cursive;font-size:clamp(20px,3.6vw,36px);color:#0e7c86;margin:2px 0}
.cert-sub{font-size:clamp(12px,1.9vw,19px);color:#4a3c28;max-width:80%;margin:8px auto 0}
.cert-stats{display:flex;gap:clamp(8px,2vw,22px);flex-wrap:wrap;justify-content:center;margin-top:16px;font-size:clamp(11px,1.5vw,15px);font-weight:700;color:#7a5a2c}
.cert-foot{display:flex;align-items:flex-end;justify-content:space-between;width:100%;margin-top:auto;padding-top:6%}
.cert-sign{display:flex;flex-direction:column;align-items:center;min-width:130px}
.cert-sign span{font-size:clamp(13px,1.8vw,18px);color:#2c3a2f;border-bottom:2px solid #c9a24b;padding:0 14px 3px}
.cert-sign small{margin-top:4px;font-size:11px;color:#9a8256;text-transform:uppercase;letter-spacing:.08em}
.cert-ribbon{font-size:clamp(30px,5vw,52px)}
body.cert-open{overflow:hidden}
@media print{
  body.cert-open>*:not(#certOverlay){display:none !important}
  #certOverlay{position:static;background:none;padding:0;display:block;backdrop-filter:none}
  #certOverlay .no-print{display:none !important}
  .cert{width:100%;box-shadow:none;aspect-ratio:1.414/1}
  @page{size:landscape;margin:10mm}
}

/* ===== Mascot guide (Sinag) ===== */
.mascot{position:absolute;left:22px;bottom:92px;z-index:3;display:flex;align-items:flex-end;gap:10px;max-width:min(62vw,380px)}
.mascot-face{font-size:clamp(46px,7vw,74px);filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:mascotIdle 3.2s ease-in-out infinite;transform-origin:bottom center;cursor:default}
.mascot-face.wave{animation:mascotWave 1.3s ease-in-out}
.mascot-face.cheer{animation:mascotCheer .7s ease}
.mascot-face.point{animation:mascotPoint 1.4s ease-in-out infinite}
@keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes mascotWave{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(11deg)}}
@keyframes mascotCheer{0%{transform:scale(1)}40%{transform:scale(1.3) translateY(-14px)}100%{transform:scale(1)}}
@keyframes mascotPoint{0%,100%{transform:translateX(0)}50%{transform:translateX(9px)}}
.mascot-bubble{background:rgba(255,255,255,.96);color:#08131a;border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:15px;line-height:1.35;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:bubbleIn .4s;max-width:290px}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.mascot-face{animation:none !important}}
@media(max-width:640px){.mascot{left:10px;bottom:86px;max-width:74vw}.mascot-bubble{font-size:13px;max-width:210px}}

@media print{
  .sidebar,.topbar,.backdrop,.no-print,.modal-bg{display:none !important}
  .main{display:block}
  body{background:#fff;color:#000}
  .view{padding:0;max-width:none;animation:none}
  .story-page{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border:1px solid #ccc}
  .story-hero{box-shadow:none;border:1px solid #ccc}
}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .topbar .menu-btn{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
  .backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .backdrop.show{display:block}
  .xp-wrap{max-width:none}
  .topbar .chips .chip span.t{display:none}
}
</style>
